# LAYER_CONF_VERSION is increased each time build/conf/bblayers.conf
# changes incompatibly
LCONF_VERSION = "6"

BBPATH = "${TOPDIR}"
BBFILES ?= ""
BBLAYERS_NON_REMOVABLE ?= " \
  ${TOPDIR}/../sources/poky/meta \
  ${TOPDIR}/../sources/poky/meta-yocto \
"
BBLAYERS = " \
  ${TOPDIR}/../sources/poky/meta-yocto \
  ${TOPDIR}/../sources/poky/meta \
  ${HOME}/meta-phyam335x \
  ${HOME}/meta-phytec \
"
BBLAYERS += "${HOME}/meta-phydev"
#BBLAYERS += "${HOME}/meta-yogurt"
BBLAYERS += "${TOPDIR}/../sources/meta-openembedded/meta-oe"
BBLAYERS += "${TOPDIR}/../sources/meta-openembedded/meta-networking"
BBLAYERS += "${TOPDIR}/../sources/meta-openembedded/meta-python"
BBLAYERS += "${TOPDIR}/../sources/meta-openembedded/meta-multimedia"
BBLAYERS += "${TOPDIR}/../sources/meta-openembedded/meta-ruby"
BBLAYERS += "${TOPDIR}/../sources/meta-openembedded/meta-systemd"
BBLAYERS += "${TOPDIR}/../sources/meta-openembedded/meta-gpe"
BBLAYERS += "${TOPDIR}/../sources/meta-openembedded/meta-gnome"
BBLAYERS += "${TOPDIR}/../sources/meta-qt5"
#BBLAYERS += "${TOPDIR}/../sources/meta-angstrom"
#BBLAYERS += "${TOPDIR}/../sources/meta-ti"

# ================== Attention!! =========================
# be very careful when changing stuff in this file. This
# is a global API which could break the possibility to
# build old BSPs. The SCONF Version is not managed
# automatically for old BSPs

# global augenblix development setting
DL_DIR ?= "/home/share/yocto_downloads"
SSTATE_DIR ?= "/home/share/yocto_sstate/1.7"
#CCACHE = "ccache"
#INHERIT += "ccache"
#CCACHE_DIR = "/home/${USER}/.ccache"
#CCACHE_DISABLE = "0"

# Developer settings, specific for a shared build workstation
DEV_BUILD = "True"
DEV_USER = "${USER}"
TFTP_ROOT = "/tftpboot"
NFS_ROOT = "/nfsroot"

# git overrides
# Overwrite GIT_URL and SRC_URI from recipe
# NOTE: GIT_URL is used in the task buildinfo and should be useable for git
# clone. Sadly yocto needs a different format of the url to checkout out the
# git repository over the ssh protocol. Therefore we have to specify both formats.
GIT_URL_pn-linux-ti = "ssh://git@git.phytec.de/${PN}-dev"
SRC_URI_pn-linux-ti = "git://git@git.phytec.de/${PN}-dev;protocol=ssh;branch=${BRANCH}"

GIT_URL_pn-linux-mainline = "ssh://git@git.phytec.de/${PN}-dev"
SRC_URI_pn-linux-mainline = "git://git@git.phytec.de/${PN}-dev;protocol=ssh;branch=${BRANCH}"

GIT_URL_pn-barebox = "ssh://git@git.phytec.de/${PN}-dev"
SRC_URI_pn-barebox = "git://git@git.phytec.de/${PN}-dev;protocol=ssh;branch=${BRANCH}"
VERBOSE_BUILD_pn-barebox = "1"

GIT_URL_pn-barebox-ipl = "ssh://git@git.phytec.de/barebox-dev"
SRC_URI_pn-barebox-ipl = "git://git@git.phytec.de/barebox-dev;protocol=ssh;branch=${BRANCH}"
VERBOSE_BUILD_pn-barebox-ipl = "1"

# SITE_CONF_VERSION is increased each time build/conf/site.conf
# changes incompatibly
SCONF_VERSION = "1"
